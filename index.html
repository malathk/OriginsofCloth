<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Origins of Cloth — Society of Cloth</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --paper: #f6f2ea;
      --paper-soft: #efe8dc;
      --ink: #1d1b18;
      --line: #c9c0b1;
      --muted: #7d7466;
      --accent: #8a5a3b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter", sans-serif;
      font-weight: 300;
    }

    .page {
      position: relative;
      height: 100%;
      overflow: hidden;
    }

    .intro {
      position: absolute;
      z-index: 1100;
      top: 36px;
      left: 40px;
      max-width: 360px;
      pointer-events: none;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 400;
      font-size: clamp(38px, 5vw, 68px);
      line-height: 0.95;
      margin: 0 0 16px;
    }

    .intro p {
      font-size: 14px;
      line-height: 1.65;
      color: var(--muted);
      margin: 0;
    }

    #map {
      position: absolute;
      inset: 0;
      background: var(--paper);
    }

    .leaflet-container {
      background: var(--paper);
      font-family: "Inter", sans-serif;
    }

    .leaflet-control-zoom {
      border: none !important;
      box-shadow: none !important;
    }

    .leaflet-control-zoom a {
      background: rgba(246, 242, 234, 0.9) !important;
      color: var(--ink) !important;
      border: 1px solid var(--line) !important;
      border-radius: 0 !important;
      width: 34px !important;
      height: 34px !important;
      line-height: 32px !important;
      font-weight: 300 !important;
    }

    .leaflet-control-attribution {
      background: transparent !important;
      color: var(--muted) !important;
      font-size: 9px !important;
    }

    .leaflet-control-attribution a {
      color: var(--muted) !important;
    }

    /* Square fabric-swatch marker */
    .swatch {
      width: 44px;
      height: 44px;
      padding: 2px;
      background: var(--paper);
      border: 1px solid var(--ink);
      box-shadow: 0 1px 0 rgba(29, 27, 24, 0.12);
      cursor: pointer;
      transition:
        transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
        box-shadow 0.25s ease;
    }

    .swatch:hover,
    .swatch:focus-visible {
      transform: scale(1.08);
      box-shadow: 0 6px 18px rgba(29, 27, 24, 0.18);
      outline: none;
    }

    .swatch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.86) contrast(0.98);
    }

    /* Right-side vertical material filter */
    .material-panel {
      position: absolute;
      z-index: 1200;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      width: 250px;
      background: rgba(246, 242, 234, 0.94);
      border-left: 1px solid var(--line);
      padding: 28px 24px;
      backdrop-filter: blur(6px);
    }

    .panel-label {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .material-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .material-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 11px 0;
      background: none;
      border: none;
      border-bottom: 1px solid rgba(201, 192, 177, 0.55);
      color: var(--ink);
      font-family: "Inter", sans-serif;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .material-option:hover {
      opacity: 0.65;
    }

    .material-option.active {
      color: var(--accent);
    }

    .material-count {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    /* Detail overlay */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1500;
      display: grid;
      place-items: center;
      background: rgba(29, 27, 24, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s ease;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: relative;
      width: min(880px, calc(100% - 40px));
      max-height: min(86vh, 760px);
      overflow: auto;
      background: var(--paper);
      border: 1px solid var(--ink);
      transform: scale(0.72);
      opacity: 0;
      transition:
        transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.3s ease;
    }

    .overlay.open .sheet {
      transform: scale(1);
      opacity: 1;
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
    }

    .swatch-column {
      border-right: 1px solid var(--line);
      padding: 34px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 40px;
    }

    .large-swatch {
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid var(--ink);
    }

    .large-swatch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sheet-info {
      padding: 38px 42px;
    }

    .sheet-eyebrow {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .sheet-info h2 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 400;
      font-size: 42px;
      line-height: 1;
      margin: 0 0 22px;
    }

    .facts {
      display: grid;
      gap: 0;
      margin-bottom: 26px;
    }

    .fact {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 18px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .fact-label {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding-top: 2px;
    }

    .description {
      font-size: 14px;
      line-height: 1.7;
      color: #4a443c;
      margin: 0 0 24px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 6px 12px;
      border: 1px solid var(--ink);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .close {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 2;
      width: 36px;
      height: 36px;
      border: 1px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      font-size: 18px;
      cursor: pointer;
    }

    .close:hover {
      background: var(--ink);
      color: var(--paper);
    }

    @media (max-width: 900px) {
      .intro {
        left: 22px;
        top: 22px;
        max-width: calc(100% - 44px);
      }

      .material-panel {
        top: auto;
        bottom: 0;
        right: 0;
        left: 0;
        transform: none;
        width: 100%;
        border-top: 1px solid var(--line);
        border-left: none;
        padding: 18px 22px;
      }

      .material-list {
        flex-direction: row;
        overflow-x: auto;
        gap: 14px;
      }

      .material-option {
        border-bottom: none;
        white-space: nowrap;
      }

      .sheet-grid {
        grid-template-columns: 1fr;
      }

      .swatch-column {
        border-right: none;
        border-bottom: 1px solid var(--line);
        padding: 24px;
      }

      .sheet-info {
        padding: 26px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="intro">
      <div class="eyebrow">Society of Cloth presents</div>
      <h1>Origins<br />of Cloth</h1>
      <p>
        A material map tracing where independent designers design,
        manufacture, and source the fabrics behind their work.
      </p>
    </div>

    <div id="map"></div>

    <aside class="material-panel" aria-label="Filter designers by material">
      <div class="panel-label">Material</div>
      <div class="material-list" id="materialList"></div>
    </aside>
  </div>

  <div class="overlay" id="overlay">
    <article class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetName">
      <button class="close" id="closeSheet" aria-label="Close">×</button>

      <div class="sheet-grid">
        <div class="swatch-column">
          <div class="large-swatch">
            <img id="sheetSwatch" src="" alt="" />
          </div>
          <div class="tags" id="sheetTags"></div>
        </div>

        <div class="sheet-info">
          <div class="sheet-eyebrow" id="sheetLocation"></div>
          <h2 id="sheetName"></h2>

          <div class="facts">
            <div class="fact">
              <div class="fact-label">Designed</div>
              <div id="sheetDesigned"></div>
            </div>

            <div class="fact">
              <div class="fact-label">Manufactured</div>
              <div id="sheetMade"></div>
            </div>

            <div class="fact">
              <div class="fact-label">Fibre origin</div>
              <div id="sheetFibre"></div>
            </div>

            <div class="fact">
              <div class="fact-label">Craft</div>
              <div id="sheetCraft"></div>
            </div>
          </div>

          <p class="description" id="sheetDescription"></p>
        </div>
      </div>
    </article>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const designers = [
      {
        id: "example-cotton",
        name: "Studio Name",
        location: "Delhi, India",
        lat: 28.6139,
        lng: 77.209,
        designedIn: "Delhi, India",
        manufacturedIn: "Jaipur, Rajasthan, India",
        fibreOrigin: "Organic cotton, Gujarat, India",
        craft: "Handloom weaving",
        materials: ["cotton"],
        swatch: "images/cotton-swatch.jpg",
        description:
          "This studio works with a regional weaving collective to create handloom cotton textiles. Its production is limited and centred on preserving local craft knowledge.",
        tags: ["Organic cotton", "Handloom", "Limited run"]
      }
    ];

    const materials = [
      { id: "all", label: "All" },
      { id: "cotton", label: "Cotton" },
      { id: "linen", label: "Linen" },
      { id: "silk", label: "Silk" },
      { id: "wool", label: "Wool" },
      { id: "hemp", label: "Hemp" },
      { id: "recycled", label: "Recycled" }
    ];

    const map = L.map("map", {
      center: [24, 45],
      zoom: 3,
      zoomControl: true,
      attributionControl: true,
      worldCopyJump: true
    });

    L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png",
      {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: "abcd",
        maxZoom: 18
      }
    ).addTo(map);

    const markers = new Map();

    function addDesigner(designer) {
      const marker = L.marker([designer.lat, designer.lng], {
        icon: L.divIcon({
          className: "",
          html: `
            <div
              class="swatch"
              tabindex="0"
              role="button"
              aria-label="View ${designer.name}"
            >
              <img src="${designer.swatch}" alt="Fabric swatch for ${designer.name}" />
            </div>
          `,
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        })
      });

      marker.on("click", () => openSheet(designer));
      marker.addTo(map);
      markers.set(designer.id, marker);
    }

    function openSheet(designer) {
      document.getElementById("sheetSwatch").src = designer.swatch;
      document.getElementById("sheetSwatch").alt =
        `Fabric swatch for ${designer.name}`;
      document.getElementById("sheetLocation").textContent = designer.location;
      document.getElementById("sheetName").textContent = designer.name;
      document.getElementById("sheetDesigned").textContent = designer.designedIn;
      document.getElementById("sheetMade").textContent = designer.manufacturedIn;
      document.getElementById("sheetFibre").textContent = designer.fibreOrigin;
      document.getElementById("sheetCraft").textContent = designer.craft;
      document.getElementById("sheetDescription").textContent =
        designer.description;

      document.getElementById("sheetTags").innerHTML = designer.tags
        .map(tag => `<span class="tag">${tag}</span>`)
        .join("");

      document.getElementById("overlay").classList.add("open");
    }

    function closeSheet() {
      document.getElementById("overlay").classList.remove("open");
    }

    document.getElementById("closeSheet").addEventListener("click", closeSheet);

    document.getElementById("overlay").addEventListener("click", event => {
      if (event.target === event.currentTarget) closeSheet();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeSheet();
    });

    function renderFilters() {
      const list = document.getElementById("materialList");

      list.innerHTML = materials
        .map(material => {
          const count =
            material.id === "all"
              ? designers.length
              : designers.filter(designer =>
                  designer.materials.includes(material.id)
                ).length;

          return `
            <button
              class="material-option ${material.id === "all" ? "active" : ""}"
              data-material="${material.id}"
            >
              <span>${material.label}</span>
              <span class="material-count">${count}</span>
            </button>
          `;
        })
        .join("");

      list.querySelectorAll(".material-option").forEach(button => {
        button.addEventListener("click", () => {
          list
            .querySelectorAll(".material-option")
            .forEach(option => option.classList.remove("active"));

          button.classList.add("active");
          filterDesigners(button.dataset.material);
        });
      });
    }

    function filterDesigners(materialId) {
      designers.forEach(designer => {
        const marker = markers.get(designer.id);
        const visible =
          materialId === "all" || designer.materials.includes(materialId);

        if (visible) {
          if (!map.hasLayer(marker)) marker.addTo(map);
        } else {
          map.removeLayer(marker);
        }
      });
    }

    designers.forEach(addDesigner);
    renderFilters();
  </script>
</body>
</html>
