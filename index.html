<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Origins of Cloth — Society of Cloth</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --paper: #f5f1e8;
      --paper-soft: #ece5d7;
      --ink: #1d1b18;
      --line: #b9ae9c;
      --muted: #7a7264;
      --accent: #8a5a3b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: rgb(255,255,255);
      color: var(--ink);
      font-family: "Inter", sans-serif;
      font-weight: 300;
      overflow: hidden;
    }

    .page {
      position: relative;
      height: 100%;
    }

    .intro {
      position: absolute;
      z-index: 20;
      top: 46px;
      left: 52px;
      max-width: 390px;
      pointer-events: none;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 400;
      font-size: clamp(42px, 5.5vw, 76px);
      line-height: 0.92;
      margin: 0 0 18px;
    }

    .intro p {
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
      max-width: 310px;
      margin: 0;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .sphere {
      fill: var(--paper-soft);
      stroke: var(--ink);
      stroke-width: 0.5;
    }

    .country {
      fill: var(--paper-soft);
      stroke: var(--ink);
      stroke-width: 0.32;
      vector-effect: non-scaling-stroke;
    }

    .graticule {
      fill: none;
      stroke: rgba(29, 27, 24, 0.06);
      stroke-width: 0.4;
    }

    /* Square fabric swatch pin */
    .swatch {
      width: 42px;
      height: 42px;
      padding: 2px;
      background: var(--paper);
      border: 1px solid var(--ink);
      cursor: pointer;
      transition:
        transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1),
        box-shadow 0.28s ease;
    }

    .swatch:hover,
    .swatch:focus-visible {
      transform: scale(1.12);
      box-shadow: 0 8px 22px rgba(29, 27, 24, 0.18);
      outline: none;
    }

    .swatch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.82) contrast(0.98);
    }

    /* Expanding detail sheet */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: rgba(29, 27, 24, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: relative;
      width: min(920px, calc(100% - 40px));
      max-height: min(86vh, 740px);
      overflow: auto;
      background: var(--paper);
      border: 1px solid var(--ink);
      transform: scale(0.68);
      opacity: 0;
      transition:
        transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.28s ease;
    }

    .overlay.open .sheet {
      transform: scale(1);
      opacity: 1;
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
    }

    .swatch-column {
      padding: 36px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 42px;
    }

    .large-swatch {
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid var(--ink);
    }

    .large-swatch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 7px 12px;
      border: 1px solid var(--ink);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .sheet-info {
      padding: 42px 46px;
    }

    .sheet-eyebrow {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .sheet-info h2 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 400;
      font-size: 46px;
      line-height: 1;
      margin: 0 0 26px;
    }

    .facts {
      margin-bottom: 28px;
    }

    .fact {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 20px;
      padding: 13px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .fact-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      padding-top: 3px;
    }

    .description {
      font-size: 14px;
      line-height: 1.75;
      color: #4b453c;
      margin: 0;
    }

    .close {
      position: absolute;
      z-index: 2;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border: 1px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .close:hover {
      background: var(--ink);
      color: var(--paper);
    }

    @media (max-width: 950px) {
      .intro {
        top: 24px;
        left: 22px;
        max-width: calc(100% - 44px);
      }

      .sheet-grid {
        grid-template-columns: 1fr;
      }

      .swatch-column {
        border-right: none;
        border-bottom: 1px solid var(--line);
        padding: 24px;
      }

      .sheet-info {
        padding: 28px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="intro">
      <div class="eyebrow">Society of Cloth presents</div>
      <h1>Origins<br />of Cloth</h1>
      <p>
        A material map tracing where independent designers design,
        manufacture, and source the fabrics behind their work.
      </p>
    </div>

    <svg
      id="map"
      aria-label="World map showing where designers design, manufacture, and source materials"
    ></svg>
  </div>

  <div class="overlay" id="overlay">
    <article
      class="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheetName"
    >
      <button class="close" id="closeSheet" aria-label="Close">×</button>

      <div class="sheet-grid">
        <div class="swatch-column">
          <div class="large-swatch">
            <img id="sheetSwatch" src="" alt="" />
          </div>

          <div class="tags" id="sheetTags"></div>
        </div>

        <div class="sheet-info">
          <div class="sheet-eyebrow" id="sheetLocation"></div>
          <h2 id="sheetName"></h2>

          <div class="facts">
            <div class="fact">
              <div class="fact-label">Designed</div>
              <div id="sheetDesigned"></div>
            </div>

            <div class="fact">
              <div class="fact-label">Manufactured</div>
              <div id="sheetMade"></div>
            </div>

            <div class="fact">
              <div class="fact-label">Fibre origin</div>
              <div id="sheetFibre"></div>
            </div>

            <div class="fact">
              <div class="fact-label">Craft</div>
              <div id="sheetCraft"></div>
            </div>
          </div>

          <p class="description" id="sheetDescription"></p>
        </div>
      </div>
    </article>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

  <script>
    const designers = [
      {
        id: "atelier-one",
        name: "Atelier One",
        location: "Delhi, India",
        lat: 28.6139,
        lng: 77.209,
        designedIn: "Delhi, India",
        manufacturedIn: "Jaipur, Rajasthan, India",
        fibreOrigin: "Organic cotton, Gujarat, India",
        craft: "Handloom weaving",
        swatch: "images/cotton-swatch.jpg",
        description:
          "This studio works with a regional weaving collective to create handloom cotton textiles. Production is limited and centred on preserving local craft knowledge.",
        tags: ["Organic cotton", "Handloom", "Limited run"]
      },
      {
        id: "linen-house",
        name: "Linen House",
        location: "Lisbon, Portugal",
        lat: 38.7223,
        lng: -9.1393,
        designedIn: "Lisbon, Portugal",
        manufacturedIn: "Guimarães, Portugal",
        fibreOrigin: "European flax, Normandy, France",
        craft: "Woven linen",
        swatch: "images/linen-swatch.jpg",
        description:
          "Linen House creates washed linen essentials using European flax. Its production partner is located within the same region as its design studio.",
        tags: ["European flax", "Woven", "Small batch"]
      },
      {
        id: "silk-atelier",
        name: "Silk Atelier",
        location: "Como, Italy",
        lat: 45.8081,
        lng: 9.0852,
        designedIn: "Como, Italy",
        manufacturedIn: "Como, Italy",
        fibreOrigin: "Peace silk, Karnataka, India",
        craft: "Silk weaving and natural dyeing",
        swatch: "images/silk-swatch.jpg",
        description:
          "Silk Atelier creates small-run silk pieces using a traceable peace-silk supplier. The studio publishes fibre origin, dyeing method, and mill information for each collection.",
        tags: ["Peace silk", "Natural dye", "Traceable"]
      },
      {
        id: "wool-workshop",
        name: "Wool Workshop",
        location: "Yorkshire, England",
        lat: 53.9603,
        lng: -1.0821,
        designedIn: "Yorkshire, England",
        manufacturedIn: "Yorkshire, England",
        fibreOrigin: "British wool, Yorkshire",
        craft: "Knitting and finishing",
        swatch: "images/wool-swatch.jpg",
        description:
          "Wool Workshop blends locally sourced wool with reclaimed textile fibre. Knitting and finishing take place in the same region as its design studio.",
        tags: ["British wool", "Recycled fibre", "Local production"]
      }
    ];

    const svg = d3.select("#map");
    const pinLayer = svg.append("g").attr("class", "pin-layer");

    const projection = d3
      .geoNaturalEarth1()
      .rotate([-11, 0])
      .fitExtent(
        [
          [110, 130],
          [window.innerWidth - 110, window.innerHeight - 120]
        ],
        { type: "Sphere" }
      );

    const path = d3.geoPath(projection);

    function renderMap(world) {
      const countries = topojson.feature(
        world,
        world.objects.countries
      );

      const graticule = d3.geoGraticule10();

      svg
        .append("path")
        .datum(graticule)
        .attr("class", "graticule")
        .attr("d", path);

      svg
        .append("g")
        .selectAll("path")
        .data(countries.features)
        .enter()
        .append("path")
        .attr("class", "country")
        .attr("d", path);

      renderPins(designers);
    }

    function createPin(designer) {
      const [x, y] = projection([designer.lng, designer.lat]);

      const pin = pinLayer
        .append("foreignObject")
        .attr("x", x - 21)
        .attr("y", y - 21)
        .attr("width", 42)
        .attr("height", 42)
        .attr("tabindex", 0)
        .attr("role", "button")
        .attr("aria-label", `View ${designer.name}`)
        .html(`
          <div class="swatch">
            <img
              src="${designer.swatch}"
              alt="Fabric swatch for ${designer.name}"
            />
          </div>
        `);

      pin.on("click", () => openSheet(designer));

      pin.on("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openSheet(designer);
        }
      });

      return pin;
    }

    function renderPins(visibleDesigners) {
      pinLayer.selectAll("foreignObject").remove();
      visibleDesigners.forEach(createPin);
    }

    function openSheet(designer) {
      document.getElementById("sheetSwatch").src = designer.swatch;
      document.getElementById("sheetSwatch").alt =
        `Fabric swatch for ${designer.name}`;

      document.getElementById("sheetLocation").textContent =
        designer.location;

      document.getElementById("sheetName").textContent = designer.name;
      document.getElementById("sheetDesigned").textContent =
        designer.designedIn;

      document.getElementById("sheetMade").textContent =
        designer.manufacturedIn;

      document.getElementById("sheetFibre").textContent =
        designer.fibreOrigin;

      document.getElementById("sheetCraft").textContent = designer.craft;
      document.getElementById("sheetDescription").textContent =
        designer.description;

      document.getElementById("sheetTags").innerHTML = designer.tags
        .map(tag => `<span class="tag">${tag}</span>`)
        .join("");

      document.getElementById("overlay").classList.add("open");
    }

    function closeSheet() {
      document.getElementById("overlay").classList.remove("open");
    }

    document.getElementById("closeSheet").addEventListener("click", closeSheet);

    document.getElementById("overlay").addEventListener("click", event => {
      if (event.target === event.currentTarget) closeSheet();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeSheet();
    });

    fetch(
      "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
    )
      .then(response => response.json())
      .then(renderMap);
  </script>
</body>
</html>
