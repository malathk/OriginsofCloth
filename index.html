<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Origins of Cloth — Society of Cloth</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --white: #ffffff;
      --ink: #1d1b18;
      --line: #d8d2c6;
      --muted: #7a7264;
      --accent: #8a5a3b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--white);
      color: var(--ink);
      font-family: "Inter", sans-serif;
      font-weight: 300;
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: var(--white);
    }

    .sphere {
      fill: #ffffff;
      stroke: var(--ink);
      stroke-width: 0.5;
    }

    .country {
      fill: #ffffff;
      stroke: var(--ink);
      stroke-width: 0.32;
      vector-effect: non-scaling-stroke;
    }

    .graticule {
      fill: none;
      stroke: rgba(29, 27, 24, 0.06);
      stroke-width: 0.4;
    }

    /* Square fabric swatch pin */
    .swatch {
      width: 42px;
      height: 42px;
      padding: 2px;
      background: #ffffff;
      border: 1px solid var(--ink);
      cursor: pointer;
      transition:
        transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1),
        box-shadow 0.28s ease;
    }

    .swatch:hover,
    .swatch:focus-visible {
      transform: scale(1.12);
      box-shadow: 0 8px 22px rgba(29, 27, 24, 0.18);
      outline: none;
    }

    .swatch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.82) contrast(0.98);
    }

    /* Expanding detail sheet */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: rgba(29, 27, 24, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: relative;
      width: min(920px, calc(100% - 40px));
      max-height: min(86vh, 740px);
      overflow: auto;
      background: #ffffff;
      border: 1px solid var(--ink);
      transform: scale(0.68);
      opacity: 0;
      transition:
        transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.28s ease;
    }

    .overlay.open .sheet {
      transform: scale(1);
      opacity: 1;
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
    }

    .swatch-column {
      padding: 36px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 42px;
    }

    .large-swatch {
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid var(--ink);
    }

    .large-swatch img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 7px 12px;
      border: 1px solid var(--ink);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .sheet-info {
      padding: 42px 46px;
    }

    .sheet-eyebrow {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .sheet-info h2 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 400;
      font-size: 46px;
      line-height: 1;
      margin: 0 0 26px;
    }

    .facts {
      margin-bottom: 28px;
    }

    .fact {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 20px;
      padding: 13px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .fact-label {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      padding-top: 3px;
    }

    .description {
      font-size: 14px;
      line-height: 1.75;
      color: #4b453c;
      margin: 0;
    }

    .close {
      position: absolute;
      z-index: 2;
      top: 18px;
      right: 18px;
      width: 38px;
      height: 38px;
      border: 1px solid var(--ink);
      background: #ffffff;
      color: var(--ink);
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .close:hover {
      background: var(--ink);
      color: #ffffff;
    }

    @media (max-width: 950px) {
      .sheet-grid {
        grid-template-columns: 1fr;
      }

      .swatch-column {
        border-right: none;
        border-bottom: 1px solid var(--line);
        padding: 24px;
      }

      .sheet-info {
        padding: 28px;
      }
    }
  </style>
</head>

<body>
  <svg
    id="map"
    aria-label="World map showing where designers design, manufacture, and source materials"
  ></svg>

  <div class="overlay" id="overlay">
    <article
      class="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="sheetName"
    >
